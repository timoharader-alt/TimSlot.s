name: Keep Render Alive
on:
  schedule:
    - cron: '*/10 * * * *'  # Каждые 10 минут (безопасно, так как сон через 15 минут)
  workflow_dispatch:      # Позволяет запустить вручную для проверки
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: curl -s https://timslot-s.onrender.com/health
